{{- if .Values.containers }}
{{- $kind := eq .Values.workload.type "statefulset" | ternary "StatefulSet" "Deployment" }}
{{- $dump := and .Values.backup.enabled .Values.backup.dump.command }}
apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "nde-app.fullname" . }}
  labels:
    {{- include "nde-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workload.replicas }}
  {{- if and (ne .Values.workload.type "statefulset") .Values.workload.strategy }}
  strategy:
    type: {{ .Values.workload.strategy }}
    {{- if eq .Values.workload.strategy "Recreate" }}
    # The API server fills in rollingUpdate on a live Deployment and rejects it
    # beside Recreate, so the patch has to remove it.
    rollingUpdate: null
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nde-app.selectorLabels" . | nindent 6 }}
  {{- if eq .Values.workload.type "statefulset" }}
  serviceName: {{ include "nde-app.fullname" . }}
  # Always rendered: podManagementPolicy is IMMUTABLE on an existing
  # StatefulSet, and Helm’s three-way patch removes any field that drops out of
  # the rendered manifest, so omitting it on upgrade makes the API server reject
  # the patch. Releases whose live StatefulSet is OrderedReady must pin that
  # value in workload.podManagementPolicy until the StatefulSet is recreated.
  podManagementPolicy: {{ .Values.workload.podManagementPolicy }}
  {{- end }}
  template:
    metadata:
      annotations:
      {{- with .Values.workload.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.configMaps }}
        # https://v3.helm.sh/docs/howto/charts_tips_and_tricks/#automatically-roll-deployments
        checksum/config: {{ toYaml .Values.configMaps | sha256sum }}
      {{- end }}
      {{- if .Values.backup.enabled }}
        {{- $backupVols := include "nde-app.backupVolumeNames.workload" . }}
        {{- if $backupVols }}
        backup.velero.io/backup-volumes: {{ $backupVols | quote }}
        {{- end }}
        {{- if $dump }}
        pre.hook.backup.velero.io/container: dump
        pre.hook.backup.velero.io/command: {{ include "nde-app.backupDumpHookCommand" . | quote }}
        pre.hook.backup.velero.io/timeout: 30m
        pre.hook.backup.velero.io/on-error: Fail
        {{- end }}
      {{- end }}
      labels:
        {{- include "nde-app.selectorLabels" . | nindent 8 }}
        app: {{ include "nde-app.fullname" . }}
    spec:
      {{- $needsGhcr := false }}
      {{- range .Values.containers }}
        {{- if hasPrefix "ghcr.io" .image.repository }}
          {{- $needsGhcr = true }}
        {{- end }}
      {{- end }}
      {{- if or .Values.imagePullSecrets $needsGhcr }}
      imagePullSecrets:
        {{- if .Values.imagePullSecrets }}
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
        {{- end }}
        {{- if and $needsGhcr (not .Values.imagePullSecrets) }}
        - name: ghcr
        {{- end }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.shareProcessNamespace }}
      shareProcessNamespace: true
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- range .Values.containers }}
        {{- $containerPort := .port }}
        - name: {{ .name }}
          image: "{{ required "image.repository is required" .image.repository }}:{{ required "image.tag is required" .image.tag }}"
          {{- with .image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .port }}
          ports:
            - containerPort: {{ . }}
          {{- end }}
          {{- /* Pass through all standard container fields dynamically */ -}}
          {{- $passthrough := omit . "name" "image" "port" "flux" "livenessProbe" "readinessProbe" "startupProbe" }}
          {{- with $passthrough }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- /* Handle probes with httpGet defaults */ -}}
          {{- with .livenessProbe }}
          {{- $defaults := dict "httpGet" (dict "path" "/" "port" $containerPort) }}
          livenessProbe:
            {{- toYaml (mergeOverwrite $defaults .) | nindent 12 }}
          {{- end }}
          {{- with .readinessProbe }}
          {{- $defaults := dict "httpGet" (dict "path" "/" "port" $containerPort) }}
          readinessProbe:
            {{- toYaml (mergeOverwrite $defaults .) | nindent 12 }}
          {{- end }}
          {{- with .startupProbe }}
          {{- $defaults := dict "httpGet" (dict "path" "/" "port" $containerPort) }}
          startupProbe:
            {{- toYaml (mergeOverwrite $defaults .) | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $dump }}
        {{- $database := first .Values.containers }}
        # The dump runs in a container of its own, with the database’s image and
        # environment, so that its memory does not count against the database’s limit.
        - name: dump
          image: "{{ $database.image.repository }}:{{ $database.image.tag }}"
          command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
          {{- with $database.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # Set explicitly: the namespace default of 250m per container would
              # use up what is left of the CPU limit quota.
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: dump
              mountPath: /backup
        {{- end }}
      {{- $volumes := .Values.volumes | default list }}
      {{- if $dump }}
      {{- $dumpClaim := dict "claimName" (printf "%s-dump" (include "nde-app.fullname" .)) }}
      {{- $volumes = append $volumes (dict "name" "dump" "persistentVolumeClaim" $dumpClaim) }}
      {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and (eq .Values.workload.type "statefulset") .Values.persistentVolumes }}
  volumeClaimTemplates:
    {{- range .Values.persistentVolumes }}
    - metadata:
        name: {{ .name }}
      spec:
        accessModes:
          - {{ .accessMode | default "ReadWriteOnce" }}
        resources:
          requests:
            storage: {{ .size }}
        storageClassName: {{ .storageClass | default "hdd" }}
    {{- end }}
  {{- end }}
{{- end }}
