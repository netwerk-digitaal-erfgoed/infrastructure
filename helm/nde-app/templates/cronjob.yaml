{{- range .Values.cronjobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nde-app.fullname" $ }}-{{ required "cronjobs[].name is required" .name }}
  labels:
    {{- include "nde-app.labels" $ | nindent 4 }}
spec:
  schedule: {{ required "cronjobs[].schedule is required" .schedule | quote }}
  {{- with .timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- with .concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- if .suspend }}
  suspend: true
  {{- end }}
  jobTemplate:
    spec:
      {{- include "nde-app.jobSpec" (list $ . "cronjobs") | trim | nindent 6 }}
{{- end }}
