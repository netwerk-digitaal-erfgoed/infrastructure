{{- range $index, $ingress := .Values.ingresses }}
{{- $isFirst := eq $index 0 }}
{{- $name := $ingress.name | default (include "nde-app.fullname" $) }}
{{- if not $isFirst }}
{{- $name = printf "%s-%s" (include "nde-app.fullname" $) $ingress.name }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "nde-app.labels" $ | nindent 4 }}
  {{- $annotations := dict }}
  {{- if $.Values.ingress.forceSslRedirect }}
  {{- /* Traefik redirects to HTTPS per ingress, not per host like nginx did, so also redirect ingresses without their own TLS block. */}}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/force-ssl-redirect" "true" }}
  {{- end }}
  {{- if and (ne (($ingress.tls).enabled) false) (or $isFirst (($ingress.tls).enabled)) }}
  {{- $annotations = mustMergeOverwrite $annotations (deepCopy ($.Values.ingress.annotations | default dict)) }}
  {{- $firstHost := index $ingress.hosts 0 }}
  {{- if gt (len $firstHost) 64 }}
  {{- $_ := set $annotations "cert-manager.io/common-name" ($firstHost | trunc 64) }}
  {{- end }}
  {{- end }}
  {{- /* Per-ingress annotations override the shared ones, e.g. a different cert-manager issuer. */}}
  {{- $annotations = mustMergeOverwrite $annotations ($ingress.annotations | default dict) }}
  annotations:
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ required "ingress.className is required" $.Values.ingress.className }}
  {{- if $ingress.hosts }}
  {{- if and (ne (($ingress.tls).enabled) false) (or $isFirst (($ingress.tls).enabled)) }}
  tls:
    - secretName: {{ (($ingress.tls).secretName) | default (printf "%s-tls" $name) }}
      hosts:
        {{- range $ingress.hosts }}
        - {{ . }}
        {{- end }}
  {{- end }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range $ingress.paths | default (list (dict "path" "/" "pathType" "Prefix")) }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "nde-app.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
