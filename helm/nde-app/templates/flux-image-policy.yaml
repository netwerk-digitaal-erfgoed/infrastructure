{{- range .Values.containers }}
{{- $fluxEnabled := ne ((.flux).enabled) false }}
{{- if $fluxEnabled }}
{{- $fluxName := include "nde-app.fluxName" (list ((.flux).name) (include "nde-app.fullname" $) .name) }}
{{- $policyType := (((.flux).policy).type) | default "numerical" }}
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: {{ $fluxName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nde-app.labels" $ | nindent 4 }}
spec:
  imageRepositoryRef:
    name: {{ $fluxName }}
  {{- if eq $policyType "numerical" }}
  filterTags:
    pattern: {{ (((.flux).policy).pattern) | default "^(?P<timestamp>[0-9]{14}).*" | squote }}
    extract: {{ (((.flux).policy).extract) | default "$timestamp" | squote }}
  policy:
    numerical:
      order: {{ (((.flux).policy).order) | default "asc" }}
  {{- else if eq $policyType "semver" }}
  {{- if or (((.flux).policy).pattern) (((.flux).policy).extract) }}
  filterTags:
    pattern: {{ (((.flux).policy).pattern) | squote }}
    extract: {{ (((.flux).policy).extract) | squote }}
  {{- end }}
  policy:
    semver:
      range: {{ (((.flux).policy).range) | squote }}
  {{- end }}
{{- end }}
{{- end }}
{{- /*
  CronJobs and Jobs need the same ImagePolicy as containers so their
  `# {"$imagepolicy": …}` markers resolve; see flux-image-repository.yaml, which
  also explains why each name is rendered once. The spec mirrors the container
  block above (it depends only on .flux and $fluxName, not on the workload kind).
*/ -}}
{{- $rendered := dict }}
{{- range concat .Values.cronjobs .Values.jobs }}
{{- $fluxEnabled := ne ((.flux).enabled) false }}
{{- $fluxName := include "nde-app.fluxName" (list ((.flux).name) (include "nde-app.fullname" $) .name) }}
{{- if and $fluxEnabled .image (not (hasKey $rendered $fluxName)) }}
{{- $_ := set $rendered $fluxName true }}
{{- $policyType := (((.flux).policy).type) | default "numerical" }}
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: {{ $fluxName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nde-app.labels" $ | nindent 4 }}
spec:
  imageRepositoryRef:
    name: {{ $fluxName }}
  {{- if eq $policyType "numerical" }}
  filterTags:
    pattern: {{ (((.flux).policy).pattern) | default "^(?P<timestamp>[0-9]{14}).*" | squote }}
    extract: {{ (((.flux).policy).extract) | default "$timestamp" | squote }}
  policy:
    numerical:
      order: {{ (((.flux).policy).order) | default "asc" }}
  {{- else if eq $policyType "semver" }}
  {{- if or (((.flux).policy).pattern) (((.flux).policy).extract) }}
  filterTags:
    pattern: {{ (((.flux).policy).pattern) | squote }}
    extract: {{ (((.flux).policy).extract) | squote }}
  {{- end }}
  policy:
    semver:
      range: {{ (((.flux).policy).range) | squote }}
  {{- end }}
{{- end }}
{{- end }}
