apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omeka-s-faq-mysql
  namespace: nde
spec:
  serviceAccountName: nde
  interval: 30m
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    workload:
      type: statefulset
      podManagementPolicy: OrderedReady

    backup:
      enabled: true
      dump:
        command: mariadb-dump -h 127.0.0.1 -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --single-transaction "$MYSQL_DATABASE"
        size: 2Gi
    containers:
      - name: mariadb
        image:
          repository: mariadb
          tag: "11.4.13" # {"$imagepolicy": "nde:omeka-s-faq-mysql-mariadb:tag"}
        port: 3306
        flux:
          policy:
            type: semver
            range: "~11.4"
        # The SURF default limit of 256Mi is too low: the container peaks at it and was OOM-killed.
        # The default CPU limit of 250m is too low as well: crawler load kept it fully throttled,
        # so the nightly dump overran the 30-minute Velero hook timeout.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: omeka-s-faq-mysql
                key: root-password
          - name: MYSQL_USER
            valueFrom:
              secretKeyRef:
                name: omeka-s-faq-mysql
                key: username
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: omeka-s-faq-mysql
                key: password
          - name: MYSQL_DATABASE
            value: omeka_s_faq
        volumeMounts:
          - name: data
            mountPath: /var/lib/mysql
    persistentVolumes:
      - name: data
        size: 8Gi
    service:
      port: 3306
      targetPort: 3306
