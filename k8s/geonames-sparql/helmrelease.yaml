apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: geonames-sparql
  namespace: nde
spec:
  serviceAccountName: nde
  interval: 30m
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  # Don't block helm upgrade on pod readiness – let the StatefulSet controller
  # roll the pod on its own schedule. Otherwise a CrashLoopBackOff pod stalls
  # Flux retries for 5 minutes per attempt.
  install:
    disableWait: true
  upgrade:
    disableWait: true
    # Force `helm upgrade --force`: replace (delete + create) resources instead
    # of patching. Bypasses StatefulSet rollouts that are stuck mid-update.
    force: true
  values:
    workload:
      type: statefulset

    containers:
      - name: app
        image:
          repository: netwerkdigitaalerfgoed/fuseki
          tag: "6.1.0" # {"$imagepolicy": "nde:geonames-sparql-fuseki:tag"}
        # Fuseki Main does not auto-load $FUSEKI_BASE/config.ttl – it must be
        # passed explicitly via --config. Without this, Fuseki starts admin-only
        # with no datasets and /sparql returns 404.
        args:
          - --config=/fuseki/run/config.ttl
        flux:
          policy:
            type: semver
            range: ">=6.1.0"
        port: 3030
        resources:
          requests:
            # A 500m request told the scheduler this was a small workload, so it packed the
            # server onto a node alongside two QLever stores. The request is also the CFS
            # share weight once that node is busy, so ask for what a query actually costs.
            cpu: 2
            memory: 8Gi
          limits:
            # At cpu: 2 the container was throttled in ~85% of its CFS periods whenever a few
            # queries overlapped on a cold page cache: the quota was spent early in each 100ms
            # period and every thread – including the one answering /$/ping – stalled for the
            # rest of it. 4 leaves headroom for query threads plus G1 during warm-up.
            cpu: 4
            memory: 14Gi
        env:
          # Apache's entrypoint reads JAVA_OPTIONS (not JVM_ARGS, which the old stain image used).
          # TDB2 and the Lucene index are memory-mapped – they live in the OS page cache,
          # NOT the JVM heap – so a small heap plus a large page cache is fastest. The heap
          # is barely used (~0.3Gi idle), so cap it low and leave the rest of the 14Gi limit
          # for page cache to keep the index hot. Cold full-text queries were ~5s vs <100ms
          # warm; more resident index = fewer cold faults.
          - name: JAVA_OPTIONS
            value: "-Xmx4g -Xlog:gc*:stdout:time,level,tags"
        volumeMounts:
          # Writable emptyDir for FUSEKI_BASE (default /fuseki/run). Fuseki creates
          # shiro.ini, configuration/, system/ etc. here. State is regenerable, ephemeral
          # by design.
          - name: fuseki-run
            mountPath: /fuseki/run
          - name: config
            mountPath: /fuseki/run/config.ttl
            subPath: config.ttl
          - name: data
            mountPath: /data
            subPath: production
        # No livenessProbe. This server’s only failure mode is slowness – a cold mmap cache
        # after a restart or a reindex swap – and killing it for that empties the cache again,
        # so the next start is slower and gets killed sooner. That is a crashloop, not a
        # recovery: on 2026-08-21 the default 1s timeout took the endpoint down for hours.
        # Readiness alone is the right response, and the StatefulSet still restarts the pod if
        # the process actually exits.
        startupProbe:
          httpGet:
            path: /$/ping
          periodSeconds: 10
          # Up to 5 minutes to open the TDB2 store and the Lucene index and answer, so a slow
          # start never counts against readiness.
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /$/ping
          periodSeconds: 15
          # The 1s default is far too tight for a JVM in a G1 pause while it faults index
          # pages in from the volume; 5s distinguishes “busy” from “gone”.
          timeoutSeconds: 5

    securityContext:
      fsGroup: 100

    volumes:
      - name: config
        configMap:
          name: geonames-sparql-fuseki-config
      - name: fuseki-run
        emptyDir: {}

    persistentVolumes:
      - name: data
        size: 50Gi
      # Retained but no longer mounted. Fuseki 6.1 runs entirely from its image.
      # Safe to delete this entry (and the orphaned PVC) once we are sure
      # nothing in /fuseki is needed.
      - name: fuseki
        size: 10Gi

    service:
      port: 80
      targetPort: 3030

    ingresses:
      - ingressClassName: nginx-shared
        hosts:
          - geonames.netwerkdigitaalerfgoed.nl
        paths:
          - path: /
            pathType: Prefix

    configMaps:
      - name: fuseki-config
        data:
          config.ttl: |
            @prefix :       <#> .
            @prefix fuseki: <http://jena.apache.org/fuseki#> .
            @prefix gn:     <https://www.geonames.org/ontology#> .
            @prefix tdb2:   <http://jena.apache.org/2016/tdb#> .
            @prefix text:   <http://jena.apache.org/text#> .

            [] a fuseki:Server ;
               fuseki:services (:geonames) .

            :geonames a fuseki:Service ;
                      fuseki:name "" ;
                      fuseki:label "GeoNames" ;
                      fuseki:serviceQuery "sparql" ;
                      fuseki:serviceReadGraphStore "get" ;
                      fuseki:dataset :textDataset ;
            .

            :textDataset a text:TextDataset ;
              text:dataset :dataset ;
              text:index :index ;
            .

            :dataset a tdb2:DatasetTDB2 ;
              tdb2:location "/data/tdb" ;
            .

            :index a text:TextIndexLucene ;
              text:directory <file:/data/index> ;
              text:entityMap :entityMap ;
            
              # The default analyzer skips tokens < 3 chars, such as country codes ('NL', 'BE').
              # Matching such short tokens is very slow, returning many irrelevant results.
              # Country code matching is handled in the SPARQL query instead.
              text:defineAnalyzers (
                [ text:defineFilter :lengthFilter ;
                  text:filter [
                    a text:GenericFilter ;
                    text:class "org.apache.lucene.analysis.miscellaneous.LengthFilter" ;
                    text:params (
                      [ text:paramName "min" ; text:paramValue 3 ]
                      [ text:paramName "max" ; text:paramValue 2147483647 ]
                    ) ] ]
              ) ;
              text:analyzer [
                a text:ConfigurableAnalyzer ;
                text:tokenizer text:StandardTokenizer ;
                text:filters ( text:ASCIIFoldingFilter text:LowerCaseFilter :lengthFilter ) ;
              ] ;
            .

            # Several entries may share a text:field: EntityDefinitionAssembler collects them into a
            # MultiValuedMap<String, Node> and EntityDefinition keeps a ListValuedMap per field, adding
            # each predicate uniquely. Jena’s documentation does not mention this, so it is worth naming.
            #
            # The two fields mirror the two SKOS roles the GeoNames ontology assigns these properties:
            # gn:officialName is rdfs:subPropertyOf skos:prefLabel, like gn:name, so it belongs in the
            # field the search query boosts with ^3; gn:shortName, gn:colloquialName and
            # gn:historicalName are all rdfs:subPropertyOf gn:alternateName. Since the dataset carries
            # no reasoner, every subproperty has to be listed explicitly or its names are not indexed
            # at all – which is how 565,670 names would silently drop out once geonames-rdf publishes
            # them under the new predicates.
            :entityMap a text:EntityMap ;
              text:defaultField "name" ;
              text:entityField "uri" ;
              text:map (
                [
                  text:field "name" ;
                  text:predicate gn:name ;
                  # text:boost is silently ignored (never implemented in Jena, removed from Lucene in 7.0).
                  # Boosting is done at query time using Lucene's ^N syntax in the SPARQL query instead.
                ]
                [
                  text:field "name" ;
                  text:predicate gn:officialName ;
                ]
                [
                  text:field "alternateName" ;
                  text:predicate gn:alternateName ;
                ]
                [
                  text:field "alternateName" ;
                  text:predicate gn:shortName ;
                ]
                [
                  text:field "alternateName" ;
                  text:predicate gn:colloquialName ;
                ]
                [
                  text:field "alternateName" ;
                  text:predicate gn:historicalName ;
                ]
                # countryCode is no longer in the text index;
                # country code matching is handled in the SPARQL query instead.
              ) ;
            .
