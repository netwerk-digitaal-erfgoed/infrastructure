# Temporary while dataset-register-demo (PHP) is scaled to 0 because of the PHP
# RCEs CVE-2026-109618 and CVE-2026-109619: redirects the home page to the search
# page in dataset-register-browser. Used by its root-redirect ingress.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dataset-register-root-redirect
  namespace: nde
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/$
    replacement: ${1}/datasets
    permanent: false
