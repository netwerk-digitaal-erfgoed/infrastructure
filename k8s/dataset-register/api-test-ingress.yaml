# TEMPORARY: adopts an Ingress the dataset-register-api Helm release left
# behind, so Flux can move it off nginx-shared and later prune it. While it
# stayed on nginx-shared, ExternalDNS published its old IP (145.38.218.42) for
# datasetregister.netwerkdigitaalerfgoed.nl. Delete this file in a follow-up
# commit; Flux then deletes the Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataset-register-api-test
  namespace: nde
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: traefik-shared
  rules:
    - host: datasetregister.netwerkdigitaalerfgoed.nl
      http:
        paths:
          - path: /apitest(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dataset-register-api
                port:
                  number: 80
