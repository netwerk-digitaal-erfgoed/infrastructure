apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dataset-register-qlever
spec:
  serviceAccountName: nde
  interval: 30m
  upgrade:
    remediation:
      remediateLastFailure: false
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    workload:
      type: statefulset
      podManagementPolicy: OrderedReady
      # Bump to restart the pods after rotating the dataset-register-qlever secret.
      podAnnotations:
        secret-rotated-at: "2026-10-16"

    backup:
      enabled: true

    # One-off for the move to an index format of September 2026: the app container’s
    # qlever-upgrade-index refuses an index with persisted updates, and only the old
    # binary can fold them into the index. The pod is not ready while this runs, so
    # no updates arrive in between. Does nothing once the index is upgraded; remove it
    # after the upgrade.
    initContainers:
      - name: fold-updates
        image: adfreiburg/qlever:commit-4d113e0
        env:
          - name: ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: dataset-register-qlever
                key: access-token
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 12Gi
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /config/Qleverfile
            subPath: Qleverfile
        workingDir: /data
        command:
          - sh
          - -c
          - |
            set -e
            redact() { sed -u "s/$ACCESS_TOKEN/[redacted]/g"; }

            if ! grep -Eq '"pull-request-number": *1572\b' dataset-register.meta-data.json; then
              echo "Index is not in the old format, nothing to fold"
              exit 0
            fi

            # Keep a copy of the index as it was before the upgrade.
            if ! ls -d pre-upgrade.* >/dev/null 2>&1; then
              # Copy to a temporary name first, so an interrupted copy isn’t taken for a backup.
              backup_dir="pre-upgrade.$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              rm -rf backup.tmp
              mkdir backup.tmp
              cp -a dataset-register.* backup.tmp/
              mv backup.tmp "$backup_dir"
              echo "Copied the index to $backup_dir"
            fi

            if [ ! -f dataset-register.update-triples ]; then
              echo "No persisted updates to fold"
              exit 0
            fi

            cp /config/Qleverfile Qleverfile
            qlever start --access-token "$ACCESS_TOKEN" 2>&1 | redact
            old_index_dir="previous.$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            qlever rebuild-index --access-token "$ACCESS_TOKEN" --keep-old-index-dirs newest --old-index-dir "$old_index_dir" 2>&1 | redact
            qlever stop 2>&1 | redact

            # Same checks as the nightly rebuild (https://github.com/ad-freiburg/qlever/issues/2806).
            if [ ! -f dataset-register.meta-data.json ]; then
              echo "ERROR: index missing after rebuild, restoring from $old_index_dir"
              mv "$old_index_dir"/dataset-register.* .
              mv "$old_index_dir"/Qleverfile . 2>/dev/null || true
              exit 1
            fi
            if [ ! -d "$old_index_dir" ]; then
              echo "ERROR: rebuild failed, the index still has its persisted updates"
              exit 1
            fi
            mv dataset-register.update-triples "$old_index_dir"/
            echo "Folded the persisted updates into the index"

    containers:
      - name: app
        image:
          repository: adfreiburg/qlever
          tag: commit-6fd6171141
        flux:
          enabled: false
        port: 7001
        env:
          - name: ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: dataset-register-qlever
                key: access-token
        resources:
          # qlever is memory-mapped: the cgroup memory LIMIT bounds working set +
          # mmap'd index page cache, NOT just RSS. Capping the limit too low starves
          # the page cache and queries fault from disk (very slow) — the working-set
          # metric stays ~0.7Gi and hides this. So keep the limit at 12Gi for caching
          # headroom, but lower the request to 4Gi (~5.7x the ~0.7Gi working set) to
          # free ~8Gi of standing request-quota on the near-full nde namespace.
          # Burstable QoS as a result (request < limit).
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 12Gi
        startupProbe:
          httpGet:
            path: /?query=ASK%20%7B%7D
            port: 7001
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 60  # Allow time for indexing.
        livenessProbe:
          httpGet:
            path: /?query=ASK%20%7B%7D
            port: 7001
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /config/Qleverfile
            subPath: Qleverfile
        workingDir: /data
        command:
          - sh
          - -c
          - |
            # The qlever CLI echoes the commands it runs, access token included, and this
            # output ends up in Loki. Pipe every qlever command through redact.
            redact() { sed -u "s/$ACCESS_TOKEN/[redacted]/g"; }

            # Trap SIGTERM so kubelet (and kill 1) can terminate PID 1 cleanly.
            trap 'echo "SIGTERM received, stopping qlever-server"; qlever stop --access-token "$ACCESS_TOKEN" 2>/dev/null | redact; exit 0' TERM INT

            # Copy Qleverfile so it's not mounted in /data (avoids issues with rebuild-index moving files)
            cp /config/Qleverfile Qleverfile

            start_server() {
              qlever start --access-token "$ACCESS_TOKEN" 2>&1 | redact
              qlever log 2>&1 | redact &
            }

            # The fold-updates init container has left the index without persisted updates.
            if grep -Eq '"pull-request-number": *1572\b' dataset-register.meta-data.json; then
              echo "Upgrading the index to the current format at $(date)"
              qlever-upgrade-index dataset-register 2>&1 | redact
              # A failed upgrade leaves the index untouched; the new server can’t load it.
              if grep -Eq '"pull-request-number": *1572\b' dataset-register.meta-data.json; then
                echo "FATAL: index upgrade failed at $(date)"
                exit 1
              fi
            fi

            start_server

            # Daily rebuild loop
            while true; do
              # Calculate seconds until 2:30 AM
              now=$(date +%s)
              today_target=$(date -d "today 02:30" +%s 2>/dev/null || date -v2H -v30M -v0S +%s)
              if [ $now -lt $today_target ]; then
                sleep_seconds=$((today_target - now))
              else
                tomorrow_target=$(date -d "tomorrow 02:30" +%s 2>/dev/null || date -v+1d -v2H -v30M -v0S +%s)
                sleep_seconds=$((tomorrow_target - now))
              fi

              echo "Sleeping until 2:30 AM ($sleep_seconds seconds)..."
              sleep $sleep_seconds

              echo "Starting index rebuild at $(date)"
              # The server swaps in the rebuilt index without a restart. It moves the old index,
              # with the update-triples file that applies to it, to a previous.* directory and
              # prunes those according to REBUILD_KEEP_PREVIOUS_INDEX_DIRS. If the rebuild
              # fails, the server keeps serving the current index.
              qlever rebuild-index --access-token "$ACCESS_TOKEN" 2>&1 | redact
              if [ -f dataset-register.meta-data.json ]; then
                echo "Rebuild finished at $(date)"
              else
                echo "ERROR: index missing after rebuild at $(date), see the newest previous.* directory"
              fi
            done
    securityContext:
      fsGroup: 100

    volumes:
      - name: config
        configMap:
          name: dataset-register-qlever-qleverfile

    persistentVolumes:
      - name: data
        size: 50Gi

    ingresses:
      - hosts:
          - datasetregister.netwerkdigitaalerfgoed.nl
        paths:
          - path: /sparql
            pathType: Prefix
        tls:
          enabled: false

    configMaps:
      - name: qleverfile
        data:
          Qleverfile: |
            [data]
            NAME              = dataset-register
            TEXT_DESCRIPTION  = All literals, search with FILTER CONTAINS(?var, "...")
            DESCRIPTION       = NDE Dataset Register
            FORMAT            = nq

            [index]
            INPUT_FILES     = data.nq
            CAT_INPUT_FILES = cat ${INPUT_FILES}
            SETTINGS_JSON   = { "ascii-prefixes-only": true, "num-triples-per-batch": 100000 }
            TEXT_INDEX      = none

            [server]
            PORT               = 7001
            MEMORY_FOR_QUERIES = 8G
            CACHE_MAX_SIZE     = 2G
            TIMEOUT            = 30s
            PERSIST_UPDATES    = true
            REBUILD_KEEP_PREVIOUS_INDEX_DIRS = most-recent-only

            [runtime]
            SYSTEM = native

            [ui]
            UI_CONFIG = dataset-register
