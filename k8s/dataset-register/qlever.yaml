apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dataset-register-qlever
spec:
  serviceAccountName: nde
  interval: 30m
  upgrade:
    remediation:
      remediateLastFailure: false
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    workload:
      type: statefulset
      podManagementPolicy: OrderedReady

    containers:
      - name: app
        image:
          repository: adfreiburg/qlever
          tag: commit-4d113e0
        flux:
          enabled: false
        port: 7001
        env:
          - name: ACCESS_TOKEN
            valueFrom:
              secretKeyRef:
                name: dataset-register-qlever
                key: access-token
        resources:
          # qlever is memory-mapped: the cgroup memory LIMIT bounds working set +
          # mmap'd index page cache, NOT just RSS. Capping the limit too low starves
          # the page cache and queries fault from disk (very slow) — the working-set
          # metric stays ~0.7Gi and hides this. So keep the limit at 12Gi for caching
          # headroom, but lower the request to 4Gi (~5.7x the ~0.7Gi working set) to
          # free ~8Gi of standing request-quota on the near-full nde namespace.
          # Burstable QoS as a result (request < limit).
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 12Gi
        startupProbe:
          httpGet:
            path: /?query=ASK%20%7B%7D
            port: 7001
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 60  # Allow time for indexing.
        livenessProbe:
          httpGet:
            path: /?query=ASK%20%7B%7D
            port: 7001
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /config/Qleverfile
            subPath: Qleverfile
        workingDir: /data
        command:
          - sh
          - -c
          - |
            # Trap SIGTERM so kubelet (and kill 1) can terminate PID 1 cleanly.
            trap 'echo "SIGTERM received, stopping qlever-server"; qlever stop --access-token "$ACCESS_TOKEN" 2>/dev/null || true; exit 0' TERM INT

            # Copy Qleverfile so it's not mounted in /data (avoids issues with rebuild-index moving files)
            cp /config/Qleverfile Qleverfile

            start_server() {
              qlever start --access-token "$ACCESS_TOKEN"
              qlever log &
            }

            start_server

            # Daily rebuild loop
            while true; do
              # Calculate seconds until 2:30 AM
              now=$(date +%s)
              today_target=$(date -d "today 02:30" +%s 2>/dev/null || date -v2H -v30M -v0S +%s)
              if [ $now -lt $today_target ]; then
                sleep_seconds=$((today_target - now))
              else
                tomorrow_target=$(date -d "tomorrow 02:30" +%s 2>/dev/null || date -v+1d -v2H -v30M -v0S +%s)
                sleep_seconds=$((tomorrow_target - now))
              fi

              echo "Sleeping until 2:30 AM ($sleep_seconds seconds)..."
              sleep $sleep_seconds

              echo "Starting index rebuild at $(date)"
              old_index_dir="previous.$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              qlever rebuild-index --access-token "$ACCESS_TOKEN" --keep-old-index-dirs newest --old-index-dir "$old_index_dir"

              # rebuild-index may silently fail (https://github.com/ad-freiburg/qlever/issues/2806)
              # but still move the old index to $old_index_dir. Check and revert if needed.
              if [ ! -f dataset-register.meta-data.json ]; then
                echo "ERROR: index missing after rebuild at $(date), restoring from previous..."
                if [ -d "$old_index_dir" ]; then
                  mv "$old_index_dir"/dataset-register.* . 2>/dev/null || true
                  mv "$old_index_dir"/Qleverfile . 2>/dev/null || true
                  echo "Restored index from $old_index_dir at $(date)"
                else
                  echo "FATAL: no previous index to restore from at $(date)"
                fi
              elif [ ! -d "$old_index_dir" ]; then
                # The rebuild failed before replacing the index: the server keeps running on the
                # current index, which still needs its update-triples file.
                echo "ERROR: rebuild failed at $(date), keeping the current index"
              else
                echo "Rebuild complete at $(date), restarting server..."
                qlever stop

                # Move the update-triples file out of the way because QLever doesn’t remove it.
                # It goes with the index it applies to, so both are pruned together.
                for f in *.update-triples; do
                  if [ -f "$f" ]; then
                    mv "$f" "$old_index_dir"/
                  fi
                done

                # Remove the timestamped archives that earlier versions of this script left behind.
                rm -f ./*.update-triples.*

                start_server
              fi
            done
    securityContext:
      fsGroup: 100

    volumes:
      - name: config
        configMap:
          name: dataset-register-qlever-qleverfile

    persistentVolumes:
      - name: data
        size: 50Gi

    ingresses:
      - hosts:
          - datasetregister.netwerkdigitaalerfgoed.nl
        paths:
          - path: /sparql
            pathType: Prefix
        tls:
          enabled: false

    configMaps:
      - name: qleverfile
        data:
          Qleverfile: |
            [data]
            NAME              = dataset-register
            TEXT_DESCRIPTION  = All literals, search with FILTER CONTAINS(?var, "...")
            DESCRIPTION       = NDE Dataset Register
            FORMAT            = nq

            [index]
            INPUT_FILES     = data.nq
            CAT_INPUT_FILES = cat ${INPUT_FILES}
            SETTINGS_JSON   = { "ascii-prefixes-only": true, "num-triples-per-batch": 100000 }
            TEXT_INDEX      = none

            [server]
            PORT               = 7001
            MEMORY_FOR_QUERIES = 8G
            CACHE_MAX_SIZE     = 2G
            TIMEOUT            = 30s
            PERSIST_UPDATES    = true

            [runtime]
            SYSTEM = native

            [ui]
            UI_CONFIG = dataset-register
