# Temporary: smoke test for nde-app’s jobs[] (Helm hook Jobs). The ConfigMap
# records which step was applied; the hook Job must run before it changes, and
# a failing Job must leave it at the previous step. Removed once the test is done.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hook-job-smoke
  namespace: nde
spec:
  serviceAccountName: nde
  interval: 30m
  timeout: 2m
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    configMaps:
      - name: step
        data:
          step: "3"
    jobs:
      - name: hook
        image: busybox:1.37
        command: ["sh", "-c", "echo hook ran for step 3; exit 0"]
        # Delete the Job once it succeeds, so removing the release leaves nothing behind.
        hookDeletePolicy: before-hook-creation,hook-succeeded
        backoffLimit: 0
        restartPolicy: Never
        automountServiceAccountToken: false
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
        flux:
          enabled: false
