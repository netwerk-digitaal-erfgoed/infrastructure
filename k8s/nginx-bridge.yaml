# TEMPORARY nginx bridge for the move from nginx-shared to traefik-shared.
#
# The Ingresses for these hosts now use traefik-shared (145.38.219.82), but
# their DNS records are managed by hand (not by external-dns) and still point
# at nginx-shared (145.38.218.42):
#   - datasetregister.netwerkdigitaalerfgoed.nl
#   - nde.nl
#   - regeljerechten.nl (www.regeljerechten.nl is a CNAME to the apex)
# These copies keep nginx serving those hosts, with the routing rendered from
# the nde-app chart before the switch. They reuse the existing TLS secrets and
# deliberately carry no cert-manager annotations.
#
# Delete this file once the three DNS records point at 145.38.219.82.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataset-register-api-nginx-bridge
  labels:
    app.kubernetes.io/part-of: nginx-bridge
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx-shared
  rules:
    - host: "datasetregister.netwerkdigitaalerfgoed.nl"
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dataset-register-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataset-register-api-api-redirect-nginx-bridge
  labels:
    app.kubernetes.io/part-of: nginx-bridge
  annotations:
    nginx.ingress.kubernetes.io/permanent-redirect: https://datasetregister.netwerkdigitaalerfgoed.nl/api/
spec:
  ingressClassName: nginx-shared
  rules:
    - host: "datasetregister.netwerkdigitaalerfgoed.nl"
      http:
        paths:
          - path: /api
            pathType: Exact
            backend:
              service:
                name: dataset-register-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataset-register-browser-nginx-bridge
  labels:
    app.kubernetes.io/part-of: nginx-bridge
spec:
  ingressClassName: nginx-shared
  tls:
    - secretName: dataset-register-browser-tls
      hosts:
        - datasetregister.netwerkdigitaalerfgoed.nl
  rules:
    - host: "datasetregister.netwerkdigitaalerfgoed.nl"
      http:
        paths:
          - path: /dataset
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /datasets
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /changes
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /_app
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /en
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /proxy
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /sitemap.xml
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /robots.txt
            pathType: Prefix
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
          - path: /validate(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dataset-register-browser
                port:
                  number: 80
---
