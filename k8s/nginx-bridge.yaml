# TEMPORARY nginx bridge for the move from nginx-shared to traefik-shared.
#
# The Ingress for regeljerechten.nl now uses traefik-shared (145.38.219.82),
# but its DNS is hosted at Greenhost, which we don’t manage, and still points
# at nginx-shared (145.38.218.42). www.regeljerechten.nl is a CNAME to the
# apex. This copy keeps nginx serving the host, with the routing rendered from
# the nde-app chart before the switch. It reuses the existing TLS secret and
# deliberately carries no cert-manager annotations.
#
# Delete this file once regeljerechten.nl points at 145.38.219.82.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyright-tool-nginx-bridge
  labels:
    app.kubernetes.io/part-of: nginx-bridge
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  ingressClassName: nginx-shared
  tls:
    - secretName: copyright-tool-tls
      hosts:
        - regeljerechten.nl
        - www.regeljerechten.nl
  rules:
    - host: "regeljerechten.nl"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyright-tool
                port:
                  number: 80
    - host: "www.regeljerechten.nl"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyright-tool
                port:
                  number: 80
