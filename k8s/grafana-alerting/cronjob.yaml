# Grafana alert rules as code. SURF runs our Grafana, so we cannot provision files into
# it; instead this CronJob applies the rule groups in the grafana-alert-rules ConfigMap
# (configmap.yaml) through Grafana’s alerting provisioning API. Each run PUTs every group
# in full, which is idempotent: a changed rule takes effect within 15 minutes of Flux
# applying the ConfigMap, and a rule removed from a group is removed from Grafana.
#
# Rules applied this way are marked as provisioned and locked in the Grafana UI, so this
# repository stays the source of truth. To change a rule, edit configmap.yaml; to add a
# group, add a key named after the group (`<group>.json`).
#
# The token belongs to Grafana service account sa-1-editor (role Editor); see
# k8s/secrets/grafana-alerting.yaml. Alerts go to contact point “Mattermost Storingen”,
# set per rule in notification_settings.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-alerting
  namespace: nde
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-alerting
        spec:
          restartPolicy: Never
          containers:
            - name: apply
              image: curlimages/curl:8.23.0
              env:
                - name: GRAFANA_URL
                  value: https://nde.monitoring.k8s.ms4.surfsara.nl
                # Grafana folder “NDE”.
                - name: FOLDER_UID
                  value: fg0jbe1l5b3lse
                - name: GRAFANA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-alerting
                      key: token
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  for file in /rules/*.json; do
                    group=$(basename "$file" .json)
                    status=$(curl -sS -o /tmp/response -w '%{http_code}' -X PUT \
                      -H "Authorization: Bearer $GRAFANA_TOKEN" \
                      -H 'Content-Type: application/json' \
                      --data-binary "@$file" \
                      "$GRAFANA_URL/api/v1/provisioning/folder/$FOLDER_UID/rule-groups/$group")
                    echo "$group: HTTP $status"
                    if [ "$status" != 200 ]; then cat /tmp/response; exit 1; fi
                  done
              volumeMounts:
                - name: rules
                  mountPath: /rules
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: rules
              configMap:
                name: grafana-alert-rules
