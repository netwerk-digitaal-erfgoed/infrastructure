apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dataset-knowledge-graph
spec:
  serviceAccountName: nde
  interval: 30m
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    pvcs:
      - name: imports
        size: 500Gi
    cronjobs:
      - name: app
        schedule: "0 2 * * *"
        timeZone: Europe/Amsterdam
        # Replace, not Forbid: if a previous run is still going when the next
        # one is due, terminate it and start fresh rather than skipping the new
        # run. The KG is rebuilt from scratch each run, so the latest run always
        # wins; this also avoids two pipelines racing on the shared RWO volume.
        concurrencyPolicy: Replace
        backoffLimit: 1
        # Never, not the chart’s OnFailure: a failed pipeline container must end
        # the pod, sidecar included. Restarted in place, it would find the
        # sidecar still running the qlever-server the failed one started. A
        # failed run gets a fresh pod instead (backoffLimit).
        restartPolicy: Never
        # Neither container talks to the Kubernetes API.
        automountServiceAccountToken: false
        # A pinned tag, so a change spanning the image and this release (such as
        # QLEVER_ENV and the sidecar) lands in one commit here. Flux image
        # automation moves the tag to every new build of the DKG main branch
        # within minutes; to hold or roll back a version, remove the marker or
        # suspend the ImagePolicy first, or Flux overwrites a hand-edited tag.
        image: ghcr.io/netwerk-digitaal-erfgoed/dataset-knowledge-graph:20261023092251-930d0e3 # {"$imagepolicy": "nde:dataset-knowledge-graph"}
        env:
          # QLever runs in the qlever sidecar below, with a memory limit of its
          # own: a dump that runs it out of memory restarts only the sidecar and
          # fails that one dataset, instead of OOM-killing the whole run.
          - name: QLEVER_ENV
            value: remote
          - name: QLEVER_PORT
            value: "7100"
          # QLever query-memory budget, kept below the qlever sidecar’s 22Gi limit
          # so an over-budget query on a huge dataset aborts gracefully (HTTP 500,
          # caught per stage) instead of OOM-killing the sidecar and failing the
          # dataset. History: 12G under the old 16Gi shared limit OOM-killed the
          # run; see netwerk-digitaal-erfgoed/dataset-knowledge-graph#340.
          - name: QLEVER_MEMORY_MAX_SIZE
            value: "12G"
          # Output store: the pipeline writes one n-quads file per dataset onto
          # the shared volume, then signals the read-only serving QLever
          # (qlever.yaml) to rebuild from them. No GraphDB; the KG is rebuilt from
          # these files each run. OUTPUT_DIR is the single root, kept in its own
          # subdirectory so the generated data stays separate from QLever's index
          # files and logs (which live at the /data root): the pipeline derives
          # /data/output/summaries, /data/output/validation, /data/output/provenance
          # (skip-gate records, read back from the served endpoint below) and
          # /data/output/validity (RDF-validity verdicts), and the QLever rebuild
          # indexes every .nq under /data/output (see qlever.yaml's Qleverfile).
          - name: OUTPUT_DIR
            value: /data/output
          # The served (read-only) QLever the skip gate queries for the previous
          # run's records. Setting this activates dataset skipping; unset, every
          # dataset is reprocessed.
          - name: SERVED_SPARQL_ENDPOINT
            value: https://sparql.netwerkdigitaalerfgoed.nl/dataset-knowledge-graph
        volumeMounts:
          - mountPath: /app/imports
            name: imports
          - mountPath: /data
            name: nq
        # QLever runs in a native sidecar (an init container with restartPolicy
        # Always), controlled by the pipeline through the task agent of
        # @lde/task-runner-http on 127.0.0.1:7070. The agent ships as a single
        # executable that the first init container copies into a shared
        # emptyDir, so the sidecar runs the unmodified upstream QLever image.
        # See https://ldelements.org/reference/task-runner-http#kubernetes.
        initContainers:
          - name: copy-task-agent
            # Flux moves this tag to new patch releases of the agent; see
            # task-agent-image.yaml for why only patches. Its minor must match
            # the @lde/task-runner-http in the DKG lockfile: a Dependabot bump of
            # @lde/sparql-qlever can raise that, and Flux deploys the DKG image
            # without a change here, so check this when DKG’s @lde packages move
            # to a new minor.
            image: ghcr.io/ldelements/task-runner-http:0.1.0 # {"$imagepolicy": "nde:dataset-knowledge-graph-task-agent"}
            command: ['cp', '/task-agent', '/agent/task-agent']
            volumeMounts:
              - {name: task-agent, mountPath: /agent}
          - name: qlever
            # The QLever version @lde/sparql-qlever is tested against. This,
            # not QLEVER_IMAGE in the DKG repository’s .env (local Docker-mode
            # runs only), is the QLever production runs.
            image: adfreiburg/qlever:commit-a14e0a0
            restartPolicy: Always
            command: ['/agent/task-agent']
            # Kubelet’s own probes connect to the pod IP, and the agent only
            # listens on 127.0.0.1, so the probe runs inside the container.
            startupProbe:
              exec:
                command: ['/agent/task-agent', '--probe']
              periodSeconds: 1
              failureThreshold: 30
            resources:
              requests:
                cpu: "1500m"
                memory: 10Gi
              # The analysis qlever-index import is the slow phase and is
              # parallel, CPU-bound: it uses ~6 cores at peak (p95 5.9) but was
              # throttled at 3. See
              # netwerk-digitaal-erfgoed/dataset-knowledge-graph#337.
              # 22Gi, as when QLever shared the pipeline’s container: runs peaked
              # at 19–22GiB working set (page cache of the mapped index included)
              # in the 30 days before the move. Keeps a ~10Gi gap above
              # QLEVER_MEMORY_MAX_SIZE=12G. See #340.
              limits:
                cpu: "6"
                memory: 22Gi
            volumeMounts:
              - {name: task-agent, mountPath: /agent}
              # The same path as in the pipeline container: the importer refers
              # to downloaded files by path.
              - {name: imports, mountPath: /app/imports}
        volumes:
          - name: task-agent
            emptyDir: {}
          - name: imports
            persistentVolumeClaim:
              claimName: dataset-knowledge-graph-imports
          # The same ReadWriteOnce claim the serving QLever mounts. RWO allows
          # multiple pods only on one node, hence the podAffinity below.
          - name: nq
            persistentVolumeClaim:
              claimName: dataset-knowledge-graph-qlever-nq
        # Restrict to the 8-core/32GB node pool (enough RAM for this run plus the
        # co-located QLever), then pin onto the exact node where the serving
        # QLever pod lives so both can mount the ReadWriteOnce `nq` volume.
        nodeSelector:
          surf.nl/nodesize: 8core32gb
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: dataset-knowledge-graph-qlever
                topologyKey: kubernetes.io/hostname
        # The pipeline itself; QLever has its own resources in the sidecar. The
        # requests keep the old 12Gi in total, as the node’s memory requests are
        # ~95% committed. The limits add 6Gi for Node on top of QLever’s 22Gi,
        # which overcommits the 32GiB node; under real pressure the kernel kills
        # the largest process, QLever in its own container. Node sizes its heap
        # from this limit. See #340.
        resources:
          requests:
            cpu: "500m"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 6Gi
        # One user for both containers (the pipeline image’s node user), so
        # each can overwrite the index files the other wrote in earlier runs.
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 100
