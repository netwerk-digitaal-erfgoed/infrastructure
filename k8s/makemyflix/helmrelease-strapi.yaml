apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: makemyflix-strapi
  namespace: nde
spec:
  serviceAccountName: nde
  interval: 30m
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    containers:
      - name: app
        image:
          repository: ghcr.io/netwerk-digitaal-erfgoed/makemyflix-strapi
          tag: 20261013193734-762d370 # {"$imagepolicy": "nde:makemyflix-strapi:tag"}
        port: 1337
        env:
          - name: URL
            value: "https://makemyflix.netwerkdigitaalerfgoed.nl/strapi"
          - name: APP_KEYS
            valueFrom:
              secretKeyRef:
                name: makemyflix-strapi
                key: keys
          - name: API_TOKEN_SALT
            valueFrom:
              secretKeyRef:
                name: makemyflix-strapi
                key: api-token-salt
          - name: ADMIN_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: makemyflix-strapi
                key: admin-jwt-secret
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: makemyflix-strapi
                key: jwt-secret
          - name: TRANSFER_TOKEN_SALT
            valueFrom:
              secretKeyRef:
                name: makemyflix-strapi
                key: transfer-token-salt
          - name: DATABASE_HOST
            value: makemyflix-postgres
          - name: DATABASE_USERNAME
            value: postgres
          - name: DATABASE_NAME
            value: postgres
          - name: DATABASE_PORT
            value: "5432"
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: makemyflix-postgres
                key: password
          # Media is stored in the makemyflix bucket of the SURF object store and
          # served as https://files.nde.nl/makemyflix/<file>; Strapi appends the
          # bucket name to S3_PUBLIC_URL.
          - name: S3_ENDPOINT
            value: "https://objectstore.surf.nl"
          - name: S3_PUBLIC_URL
            value: "https://files.nde.nl"
          - name: S3_REGION
            value: default
          - name: S3_BUCKET
            value: makemyflix
          - name: S3_KEY
            valueFrom:
              secretKeyRef:
                name: s3
                key: key
          - name: S3_SECRET
            valueFrom:
              secretKeyRef:
                name: s3
                key: secret
        # SURF’s default limit of 256M is too low for Strapi to start: on
        # 2026-10-12 a new pod was OOM-killed on every start and crash-looped.
        # Once running it uses about 165 MiB. CPU is left at SURF’s default of
        # 250m: CPU limits count against the namespace’s limits.cpu quota.
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 768Mi
    ingresses:
      - hosts:
          - makemyflix.netwerkdigitaalerfgoed.nl
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /$1
          nginx.ingress.kubernetes.io/use-regex: "true"
        paths:
          - path: /strapi/?(.*)$
            pathType: ImplementationSpecific
        tls:
          enabled: false
