apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dataset-register-demo
spec:
  serviceAccountName: nde
  interval: 30m
  chart:
    spec:
      chart: helm/nde-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nde
  values:
    workload:
      type: statefulset
      podManagementPolicy: OrderedReady
      # Temporarily disabled because of the PHP RCEs CVE-2026-109618 and CVE-2026-109619;
      # meanwhile dataset-register-browser redirects / to the search page.
      replicas: 0
    containers:
      - name: nginx
        image:
          repository: ghcr.io/netwerk-digitaal-erfgoed/registry-demo-nginx
          tag: 20261021185701-158e181 # {"$imagepolicy": "nde:dataset-register-demo-nginx:tag"}
        port: 80
        volumeMounts:
          - mountPath: /datasetdescriptions
            name: data
      - name: php
        image:
          repository: ghcr.io/netwerk-digitaal-erfgoed/registry-demo-php-fpm
          tag: 20261021184050-1cedee9 # {"$imagepolicy": "nde:dataset-register-demo-php:tag"}
        port: 9000
        volumeMounts:
          - mountPath: /datasetdescriptions
            name: data
    ingresses:
      # Temporarily removed while the demo is scaled to 0: its catch-all route
      # shadows the home page redirect in dataset-register-browser. When restoring,
      # also rename the next ingress back to “redirect” and drop its tls block.
      # - hosts:
      #     - datasetregister.netwerkdigitaalerfgoed.nl
      #   tls:
      #     enabled: false
      - name: dataset-register-demo-redirect
        tls:
          enabled: false
        hosts:
          - demo.netwerkdigitaalerfgoed.nl
        annotations:
          nginx.ingress.kubernetes.io/permanent-redirect: https://datasetregister.netwerkdigitaalerfgoed.nl
        paths:
          - path: /register(/|$)(.*)
            pathType: ImplementationSpecific
    persistentVolumes:
      - name: data
        size: 1Gi
