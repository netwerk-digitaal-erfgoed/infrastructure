apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry # Becomes service opentelemetry-collector
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:0.126.0
  # Bearer token that remote senders (the SURF cluster) must present.
  # This cluster is not managed by Flux, so create the secret by hand with the
  # same token as the SURF copy in k8s/secrets/opentelemetry-collector-token.yaml
  # (decrypt with sops), before applying this manifest:
  #   kubectl create secret generic opentelemetry-collector-token --from-literal=token=…
  env:
    - name: OTLP_BEARER_TOKEN
      valueFrom:
        secretKeyRef:
          name: opentelemetry-collector-token
          key: token
  config:
    extensions:
      bearertokenauth:
        token: ${env:OTLP_BEARER_TOKEN}

    receivers:
      # Apps in this cluster push here unauthenticated.
      otlp:
        protocols:
          grpc: {}
          http: {}
      # Apps on the SURF cluster push here through the Ingress below.
      otlp/external:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
            auth:
              authenticator: bearertokenauth

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_size: 10000
        timeout: 10s
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.start_time
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9090"
        resource_to_telemetry_conversion:
          enabled: true
      debug: {}

    service:
      extensions: [bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [debug, prometheus]
        # No k8sattributes here: remote senders arrive from the ingress-nginx
        # pod’s IP, so the processor would attach that pod’s labels instead.
        metrics/external:
          receivers: [otlp/external]
          processors: [memory_limiter, batch]
          exporters: [debug, prometheus]

---
# Exposes the OTLP/HTTP receiver so that apps on the SURF cluster can push
# their metrics here, until SURF provides a metrics endpoint of its own.
# Only the SURF cluster’s egress address may connect; senders must also
# present the bearer token above.
#
# This cluster has no ExternalDNS: create the A record for the hostname by
# hand, pointing at the ingress-nginx load balancer (same address as
# statistieken.netwerkdigitaalerfgoed.nl).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opentelemetry-collector
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # NAT address of the SURF cluster, observed as the source of outbound
    # requests from pods there (September 2026). Not documented by SURF.
    nginx.ingress.kubernetes.io/whitelist-source-range: 145.38.218.188/32
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - otel-legacy.netwerkdigitaalerfgoed.nl
      secretName: opentelemetry-collector-tls
  rules:
    - host: otel-legacy.netwerkdigitaalerfgoed.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opentelemetry-collector
                port:
                  number: 4319

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: opentelemetry-collector
    namespace: default
