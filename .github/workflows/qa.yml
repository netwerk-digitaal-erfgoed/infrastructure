name: Validate configuration

on:
  pull_request:
    branches:
      - master

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The release preview below reads every commit since the last tag.
          fetch-depth: 0

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Lint Helm chart
        run: helm lint helm/nde-app

      # The version and notes that merging this pull request would release
      # (see nde-app.yml); nothing is pushed.
      - name: Preview the nde-app release
        uses: orhun/git-cliff-action@v4
        with:
          config: helm/cliff.toml
          args: --include-path 'helm/nde-app/**' --unreleased --bump --strip all

      - name: Validate HelmReleases
        run: |
          for hr in $(grep -rl 'chart: helm/nde-app' k8s); do
            echo "=== Validating $hr ==="
            name=$(yq '.metadata.name' "$hr")
            yq '.spec.values' "$hr" | helm template "$name" helm/nde-app -f - | \
              kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
